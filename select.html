<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>سُجُود - اختر الصلاة</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
</head>
<body>
  <div id="screen-select" class="screen active">
    <div class="select-container">
      <h1>اختر الصلاة</h1>
      <div class="prayer-grid" id="prayer-buttons">
        <button class="prayer-btn" data-prayer="fajr"><span>الفجر</span></button>
        <button class="prayer-btn" data-prayer="dhuhr"><span>الظهر</span></button>
        <button class="prayer-btn" data-prayer="asr"><span>العصر</span></button>
        <button class="prayer-btn" data-prayer="maghrib"><span>المغرب</span></button>
        <button class="prayer-btn" data-prayer="isha"><span>العشاء</span></button>
      </div>
    </div>
  </div>

  <div id="screen-tracker" class="screen">
    <div class="tracker-header">
      <h2 id="current-prayer-name">صلاة...</h2>
      <div id="rakat-display" class="big-counter">0</div>
      <p id="rakat-info">الركعة الحالية من أصل <span id="total-rakat-target">0</span></p>
    </div>
    <div class="video-wrap">
       <video id="cam-video" playsinline style="display:none;"></video>
       <canvas id="cam-canvas"></canvas>
       <div id="cam-status" class="status-indicator">جاري التحميل...</div>
    </div>
  </div>

  <div id="screen-finish" class="screen">
    <div class="finish-container">
      <div class="finish-header">
        <i class="fas fa-check-circle"></i>
        <h1>تَقَبَّلَ اللهُ طاعتكم</h1>
      </div>
      <div class="athkar-box glass-modal">
        <h3>أذكار ما بعد الصلاة</h3>
        <p id="prayer-athkar">استغفر الله (ثلاثاً)...</p>
        <button id="btn-home" class="glass-btn" style="margin-top: 20px; font-size: 1.2rem;">العودة للرئيسية</button>
      </div>
    </div>
  </div>

  <script src="athkar.js"></script>
  <script src="app.js"></script>
</body>
</html>
